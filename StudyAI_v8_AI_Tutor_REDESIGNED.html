<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#635bff"><title>StudyAI — Student Web App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f7ff;--panel:#ffffff;--text:#15213b;--muted:#68738a;--line:#e6eaf3;
  --nav:#0d1630;--nav2:#172344;--primary:#635bff;--purple:#8b5cf6;--pink:#ff4fa3;
  --blue:#4f7cff;--cyan:#22d3ee;--shadow:0 12px 35px rgba(25,35,70,.08);--radius:20px;
  --glow:0 0 0 1px rgba(99,91,255,.06),0 18px 42px rgba(70,60,190,.14)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;color:var(--text);font-family:"Plus Jakarta Sans",Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  background:
   radial-gradient(620px circle at 88% -6%,rgba(255,79,163,.16),transparent 60%),
   radial-gradient(760px circle at -8% 8%,rgba(79,124,255,.16),transparent 55%),
   radial-gradient(900px circle at 60% 110%,rgba(139,92,246,.10),transparent 55%),
   linear-gradient(180deg,#f4f7ff 0%,#f7f9fd 55%,#f4f7ff 100%);
  background-attachment:fixed;
  letter-spacing:-.01px
}
h1,h2,h3,.brand,.drawerBrand{font-family:"Sora","Plus Jakarta Sans",Inter,sans-serif}
button,input,textarea,select{font:inherit}
button,a{transition:.2s cubic-bezier(.4,0,.2,1)}
::selection{background:rgba(99,91,255,.25);color:var(--text)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#c9c5ff,#a89cff);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#b3acff,#8f80ff);background-clip:padding-box}
.app{min-height:100vh}
.side{
  width:228px;position:fixed;inset:0 auto 0 0;z-index:20;padding:18px 12px;
  color:#fff;background:linear-gradient(180deg,var(--nav),#101a36 60%,#111a31);
  border-right:1px solid rgba(255,255,255,.08);box-shadow:8px 0 30px rgba(11,18,42,.12);
  overflow:hidden
}
.side:before{content:"";position:absolute;width:260px;height:260px;left:-120px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 65%);pointer-events:none}
.side:after{content:"";position:absolute;width:220px;height:220px;left:-80px;bottom:-100px;border-radius:50%;background:radial-gradient(circle,rgba(255,79,163,.22),transparent 65%);pointer-events:none}
.brand{position:relative;z-index:1;font-family:"Sora",sans-serif;font-size:27px;font-weight:800;letter-spacing:-1px;padding:2px 10px 16px}.brandSub{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7f8bad;font-weight:800;margin-top:3px}
.brand i{font-style:normal;background:linear-gradient(90deg,#ff62ad,#6973ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.navGroupTitle{position:relative;z-index:1;padding:11px 10px 5px;color:#657294;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.12em}.nav{position:relative;z-index:1}.nav a{
  display:flex;align-items:center;gap:10px;color:#bfc8dc;text-decoration:none;padding:10px 10px;
  border-radius:12px;margin:3px 0;font-weight:750;font-size:15px
}.navIcon{width:30px;height:30px;display:grid;place-items:center;flex:0 0 30px;border-radius:9px;background:rgba(255,255,255,.055);font-size:17px;transition:.2s}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(3px)}.nav a:hover .navIcon{transform:scale(1.08)}
.nav a.active{background:linear-gradient(90deg,rgba(99,91,255,.4),rgba(255,79,163,.12));color:#fff;box-shadow:inset 3px 0 0 #8178ff,0 4px 16px rgba(99,91,255,.18)}.nav a.active .navIcon{background:linear-gradient(135deg,#635bff,#ff4fa3);box-shadow:0 5px 14px rgba(99,91,255,.35)}
.main{margin-left:228px;min-height:100vh;padding:28px;max-width:1600px}
.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:22px}
.top h1{margin:0;font-size:32px;letter-spacing:-.7px;font-family:"Sora",sans-serif}
.top p{margin:7px 0 0}
.muted{color:var(--muted);font-size:14px}
.pill{padding:9px 13px;background:linear-gradient(135deg,#eeecff,#f4eeff);color:#5148d7;border-radius:999px;font-weight:900;white-space:nowrap;box-shadow:0 4px 14px rgba(99,91,255,.14);border:1px solid rgba(99,91,255,.12)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.card{
  background:rgba(255,255,255,.92);border:1px solid rgba(225,230,241,.95);border-radius:var(--radius);
  padding:19px;box-shadow:var(--shadow);backdrop-filter:blur(8px);
  transition:.25s cubic-bezier(.4,0,.2,1)
}
.stat{position:relative;overflow:hidden}
.stat:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-25px;top:-25px;background:linear-gradient(135deg,#eceaff,#ffe3f1)}
.stat:hover{transform:translateY(-3px);box-shadow:var(--glow);border-color:#d6d1ff}
.stat b{display:block;font-size:29px;margin:6px 0;position:relative;z-index:1;background:linear-gradient(90deg,#332a8f,#6f5bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:15px}
.click{cursor:pointer;transition:.22s cubic-bezier(.4,0,.2,1)}
.click:hover{transform:translateY(-5px) scale(1.008);box-shadow:0 20px 44px rgba(35,43,80,.15);border-color:#c9c5ff}
.icon{font-size:31px;filter:drop-shadow(0 3px 8px rgba(99,91,255,.18))}
.section{display:none;animation:fade .32s cubic-bezier(.2,.7,.3,1)}
.section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
.btn{
  position:relative;overflow:hidden;border:0;border-radius:12px;padding:11px 15px;
  background:linear-gradient(135deg,var(--primary),var(--purple));background-size:160% 160%;
  color:#fff;font-weight:850;cursor:pointer;box-shadow:0 8px 18px rgba(99,91,255,.28)
}
.btn:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.35) 48%,transparent 66%);transform:translateX(-120%);transition:transform .5s ease}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(99,91,255,.36);background-position:100% 0}
.btn:hover:before{transform:translateX(120%)}
.btn:active{transform:translateY(0)}
.btn.alt{background:#eef1f8;color:#273047;box-shadow:none;border:1px solid var(--line)}
.btn.alt:hover{background:#e6e9f5;box-shadow:0 6px 16px rgba(35,43,80,.08)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.bar select,.bar input,input,textarea,select{
  padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);outline:none
}
input:focus,textarea:focus,select:focus{border-color:#9b95ff;box-shadow:0 0 0 4px rgba(99,91,255,.09)}
.bar input{min-width:220px}
.lesson{margin-top:15px}
.lesson h2{margin-top:0}
.lesson li{margin:8px 0}
.progress{height:10px;background:#eceff6;border-radius:20px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(20,30,60,.08)}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--primary),var(--purple),var(--cyan));background-size:300% 100%;border-radius:20px;animation:progressFlow 3.5s ease-in-out infinite}
@keyframes progressFlow{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
.notice{background:linear-gradient(135deg,#fff9e6,#fff4d6);border:1px solid #f0df9d;padding:13px;border-radius:14px;margin-bottom:15px}
.q{padding:16px;border:1px solid var(--line);border-radius:15px;margin:12px 0;background:#fff;transition:.2s;box-shadow:0 2px 10px rgba(30,40,80,.04)}
.q:hover{box-shadow:0 8px 22px rgba(30,40,80,.08)}
.opt{display:block;padding:10px;margin:7px 0;border:1px solid var(--line);border-radius:10px;cursor:pointer;transition:.18s}
.opt:hover{background:#f7f7ff;border-color:#c9c5ff;transform:translateX(3px)}
.chat{height:610px;display:flex;flex-direction:column}
.msgs{flex:1;overflow:auto;padding:5px}
.msg{max-width:82%;padding:12px 14px;border-radius:15px;margin:8px 0;white-space:pre-wrap;line-height:1.5;animation:fade .25s ease}
.bot{background:#eef1f7;box-shadow:0 2px 8px rgba(30,40,80,.05)}
.me{background:linear-gradient(135deg,var(--primary),var(--purple));color:#fff;margin-left:auto;box-shadow:0 6px 18px rgba(99,91,255,.28)}
.chatbar{display:flex;gap:9px;border-top:1px solid var(--line);padding-top:12px}
.chatbar textarea{flex:1;resize:none}
.toast{position:fixed;right:20px;bottom:20px;background:#10182e;color:#fff;padding:12px 15px;border-radius:12px;display:none;z-index:100}
.ncertHero{
  position:relative;overflow:hidden;color:#fff;border-radius:24px;padding:28px;margin-bottom:18px;
  background:linear-gradient(135deg,#101936 0%,#4236a8 55%,#6d54d9 100%);box-shadow:0 18px 40px rgba(45,39,135,.2)
}
.ncertHero:after{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-70px;top:-85px;background:rgba(255,255,255,.12)}
.ncertHero h1,.ncertHero p,.ncertHero .resourceRow{position:relative;z-index:1}
.ncertHero h1{margin:0 0 8px;font-size:30px}.ncertHero p{color:#e4e7ff;max-width:760px;line-height:1.55}
.ncertGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px}
.ncertCard{position:relative;overflow:hidden}
.ncertCard .tag{display:inline-block;background:#eeecff;color:#5148d7;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:850}
.resourceRow{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.heroHome{
  position:relative;overflow:hidden;padding:30px;border-radius:24px;color:#fff;margin-bottom:18px;
  background:linear-gradient(125deg,#2855ff 0%,#635bff 28%,#ff4fa3 52%,#635bff 76%,#2855ff 100%);
  background-size:260% 260%;animation:heroColorFlow 9s ease-in-out infinite;
  box-shadow:0 18px 40px rgba(52,48,150,.18)
}.heroHome:before{content:"";position:absolute;inset:-45%;background:conic-gradient(from 20deg,transparent 0 28%,rgba(255,255,255,.13) 38%,transparent 48% 72%,rgba(255,255,255,.09) 82%,transparent 90%);animation:heroShimmer 7s linear infinite;pointer-events:none}.heroHome>*{position:relative;z-index:1}@keyframes heroColorFlow{0%,100%{background-position:0% 50%}18%{background-position:100% 35%}36%{background-position:35% 100%}55%{background-position:80% 15%}72%{background-position:20% 75%}88%{background-position:100% 65%}}@keyframes heroShimmer{to{transform:rotate(360deg)}}
.heroHome h1{margin:0;font-size:34px;letter-spacing:-1px;font-family:"Sora",sans-serif;text-shadow:0 2px 18px rgba(0,0,0,.15)}.heroHome p{color:#e4e7ff;max-width:700px;line-height:1.55}
.heroActions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.heroActions .btn.alt{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.2)}
/* AI tutor is deliberately on the RIGHT side */
.floatTutor{
  position:fixed;right:22px;left:auto;bottom:22px;width:62px;height:62px;border:0;border-radius:50%;
  cursor:pointer;color:#fff;font-size:25px;font-weight:950;z-index:80;
  background:linear-gradient(135deg,var(--pink),var(--primary),var(--blue));
  box-shadow:0 10px 32px rgba(79,124,255,.4);animation:floatBob 3.2s ease-in-out infinite
}
.floatTutor:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(99,91,255,.35);animation:floatRing 2.4s ease-out infinite}
@keyframes floatRing{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes floatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.floatTutor:hover{transform:scale(1.08)}
.tutorPop{
  position:fixed;right:22px;left:auto;bottom:96px;width:345px;max-width:calc(100vw - 30px);
  background:#fff;border:1px solid #e1e4ee;border-radius:20px;box-shadow:0 24px 60px rgba(17,24,39,.25);
  z-index:79;display:none;overflow:hidden;animation:fade .22s cubic-bezier(.2,.7,.3,1)
}
.tutorHead{
  padding:14px 16px;background:linear-gradient(135deg,var(--pink),var(--primary),var(--blue));background-size:200% 200%;color:#fff;font-weight:900;
  display:flex;justify-content:space-between;align-items:center;animation:progressFlow 6s ease-in-out infinite
}
.tutorHead button{border:0;background:transparent;color:#fff;font-size:22px;cursor:pointer}
.tutorBody{padding:15px}.tutorBody p{font-size:14px;line-height:1.45}
.tutorActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tutorActions button{border:1px solid #e3e5ee;background:#f7f8fc;padding:10px;border-radius:10px;cursor:pointer;font-weight:750}
.tutorActions button:hover{background:#efedff;border-color:#c9c5ff}
.tutorInput{display:flex;gap:7px;margin-top:10px}.tutorInput input{flex:1;min-width:0}
.floatMsgs{max-height:260px;overflow-y:auto;margin-bottom:10px;padding-right:2px}
.floatMsgs .msg{max-width:88%;padding:10px 12px;font-size:13.5px;border-radius:13px;margin:7px 0;white-space:pre-wrap;line-height:1.45;animation:fade .2s ease}
.quickStartActions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:16px}.quickAction{min-width:0;min-height:76px;display:flex;align-items:center;justify-content:flex-start;gap:11px;text-align:left;padding:13px 14px;border-radius:15px}.quickAction>span:last-child{display:flex;flex-direction:column;gap:3px;min-width:0}.quickAction b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quickAction small{font-size:11px;font-weight:650;opacity:.72}.quickIcon{width:38px;height:38px;display:grid;place-items:center;flex:0 0 38px;border-radius:11px;background:rgba(255,255,255,.15);font-size:20px}.btn.alt .quickIcon{background:#eceaff}.floatTutor{display:grid;place-items:center}.aiOrb{position:relative;width:43px;height:43px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(from 210deg,#ff4fa3,#8b5cf6,#4f7cff,#22d3ee,#ff4fa3);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 5px 18px rgba(45,64,200,.35);animation:aiPulse 2.8s ease-in-out infinite}.aiOrb:before{content:"";position:absolute;inset:4px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#ffffff,#dce7ff 22%,#7567ff 65%,#3d35b7);box-shadow:inset 0 0 10px rgba(255,255,255,.55)}.aiLetters{position:relative;z-index:2;font-size:15px;font-weight:950;letter-spacing:-1px;color:#fff;text-shadow:0 1px 4px rgba(20,20,80,.35)}.aiOrb i,.aiOrb em{position:absolute;z-index:3;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff}.aiOrb i{right:1px;top:5px}.aiOrb em{left:1px;bottom:7px;width:5px;height:5px}@keyframes aiPulse{50%{transform:scale(1.06) rotate(4deg);filter:brightness(1.1)}}
@media(max-width:900px){
  .side{width:76px;padding:16px 9px}.brand{font-size:0;text-align:center;padding:2px 0 18px}.brand i{font-size:21px}.brandSub{display:none}
  .nav a{font-size:0;justify-content:center;padding:13px 5px}.nav a::first-letter{font-size:21px}
  .main{margin-left:76px;padding:19px}
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:600px){
  .main{padding:12px}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:27px}
  .grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.quickStartActions{grid-template-columns:1fr 1fr}
  .chat{height:70vh}.floatTutor{right:16px;bottom:16px}.tutorPop{right:15px;bottom:88px}
}
@media(max-width:430px){
  .grid,.cards{grid-template-columns:1fr}.side{width:62px}.main{margin-left:62px}.quickStartActions{grid-template-columns:1fr}
}

/* ChatGPT-style mobile/desktop sidebar drawer */
.menuBtn{
  position:fixed;top:17px;left:244px;z-index:75;
  width:42px;height:42px;border:1px solid var(--line);border-radius:12px;
  background:var(--panel);color:var(--text);font-size:21px;cursor:pointer;
  box-shadow:0 8px 22px rgba(20,30,60,.08)
}
.menuBtn:hover{transform:translateY(-1px)}
.drawerOverlay{position:fixed;inset:0;background:rgba(3,7,18,.45);z-index:90;display:none}
.drawerOverlay.show{display:block}
.appDrawer{
  position:fixed;left:0;top:0;bottom:0;width:300px;z-index:91;
  background:var(--panel);color:var(--text);box-shadow:18px 0 50px rgba(0,0,0,.18);
  transform:translateX(-105%);transition:transform .24s ease;display:flex;flex-direction:column
}
.appDrawer.open{transform:translateX(0)}
.drawerHead{padding:18px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawerBrand{font-size:22px;font-weight:950}
.drawerBrand span{background:linear-gradient(90deg,var(--pink),var(--primary));-webkit-background-clip:text;background-clip:text;color:transparent}
.drawerClose{border:0;background:transparent;color:var(--muted);font-size:24px;cursor:pointer}
.drawerSearch{margin:13px 14px 8px}
.drawerSearch input{width:100%}
.drawerNav{padding:4px 10px;overflow:auto}
.drawerItem{
  width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;
  color:var(--text);padding:12px 12px;border-radius:12px;cursor:pointer;text-align:left;font-weight:750
}
.drawerItem:hover{background:var(--bg)}
.drawerItem.active{background:#eeecff;color:#5148d7}
.drawerSection{padding:15px 12px 7px;color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
.themeRow{
  margin-top:auto;border-top:1px solid var(--line);padding:14px;
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
.switch{position:relative;width:48px;height:27px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#cfd5e2;border-radius:99px;cursor:pointer}
.slider:before{content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:linear-gradient(90deg,var(--pink),var(--primary))}
.switch input:checked + .slider:before{transform:translateX(21px)}
/* Dark theme */
body.dark{
  --bg:#080d1b;--panel:#111827;--text:#edf2ff;--muted:#9ca8bf;--line:#26324a;
  --nav:#050914;--nav2:#0b1120;--shadow:0 14px 38px rgba(0,0,0,.28)
}
body.dark{background:radial-gradient(circle at 75% 0%,#17143a 0,#080d1b 35%,#070b15 100%)}
body.dark .card,body.dark .bar select,body.dark .bar input,body.dark input,body.dark textarea,body.dark select{background:#111827;color:var(--text);border-color:#29354d}
body.dark .stat:after{background:#1d2740}
body.dark .btn.alt{background:#1b2539;color:#eaf0ff}
body.dark .q,body.dark .opt{background:#111827;border-color:#29354d}
body.dark .bot{background:#202a3d}
body.dark .ncertCard .tag{background:#27234e;color:#b9b4ff}
body.dark .drawerItem.active{background:#27234e;color:#c8c3ff}
body.dark .notice{background:#292515;border-color:#62552b}
body.dark .menuBtn{background:#111827;color:#fff;border-color:#29354d}
@media(min-width:901px){.menuBtn{display:none}}
@media(max-width:900px){
  .menuBtn{display:block;left:15px;top:13px}
  .side{display:none}
  .main{margin-left:0;padding-top:68px}
}

</style>
</head>
<body>
<!-- StudyAI navigation drawer -->
<button class="menuBtn" id="menuBtn" aria-label="Open StudyAI menu">☰</button>
<div class="drawerOverlay" id="drawerOverlay"></div>
<aside class="appDrawer" id="appDrawer" aria-label="StudyAI navigation">
  <div class="drawerHead">
    <div class="drawerBrand"><span>StudyAI</span></div>
    <button class="drawerClose" id="drawerClose" aria-label="Close menu">×</button>
  </div>
  <div class="drawerSearch"><input id="drawerSearch" placeholder="Search menu..."></div>
  <div class="drawerNav" id="drawerNav">
    <div class="drawerSection">Main</div>
    <button class="drawerItem active" data-route="home">🏠 <span>Dashboard</span></button>
    <button class="drawerItem" data-route="classes">🎓 <span>Classes 6–12</span></button>
    <button class="drawerItem" data-route="subjects">📚 <span>Subjects</span></button>
    <button class="drawerItem" data-route="notes">📖 <span>Study Notes</span></button>
    <button class="drawerItem" data-route="quiz">🧠 <span>Practice Quiz</span></button>
    <button class="drawerItem" data-route="papers">📝 <span>Chapter Papers</span></button>
    <button class="drawerItem" data-route="ncert">📘 <span>NCERT Library</span></button>
    <div class="drawerSection">AI</div>
    <button class="drawerItem" data-route="tutor">✨ <span>AI Tutor</span></button>
    <button class="drawerItem" data-route="settings">⚙️ <span>Settings</span></button>
  </div>
  <div class="themeRow">
    <div><b>🌙 Dark mode</b><div class="muted">Easy on the eyes at night</div></div>
    <label class="switch"><input type="checkbox" id="darkToggle"><span class="slider"></span></label>
  </div>
